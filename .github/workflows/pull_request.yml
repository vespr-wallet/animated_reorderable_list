name: CI Tests

on: pull_request
jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Flutter version from .tool-versions
        id: flutter
        run: |
          version="$(awk '$1 == "flutter" { sub(/-stable$/, "", $2); print $2 }' .tool-versions)"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=.tool-versions::Expected one 'flutter <x.y.z>-stable' line, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ steps.flutter.outputs.version }}

      - name: Get dependencies
        run: flutter pub get

      - name: Verify Formatting
        run: dart format --output=none --set-exit-if-changed .

      # --fatal-infos: lints are infos, and a bare `dart analyze` exits 0 on them
      - name: Analyze Project Source
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test
